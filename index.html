<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday ❤️</title>

    <link rel="stylesheet" href="style1.css">

</head>

<body>

    <!-- BACKGROUND MUSIC -->

    <audio id="bgMusic" loop>
        <source src="birthday1.mp3" type="audio/mpeg">
    </audio>


    <!-- BACKGROUND DECORATIONS -->

    <div class="confetti"></div>

    <div class="top-flags">
        <span>◆</span>
        <span>◆</span>
        <span>◆</span>
        <span>◆</span>
        <span>◆</span>
        <span>◆</span>
    </div>


    <!-- LEFT BALLOONS -->

    <div class="balloon pink left-balloon-1"></div>

    <div class="balloon orange left-balloon-2"></div>

    <div class="balloon clear left-balloon-3">
        <span>✦</span>
        <span>✧</span>
        <span>✦</span>
    </div>


    <!-- RIGHT BALLOONS -->

    <div class="balloon purple right-balloon-1"></div>

    <div class="balloon pink right-balloon-2"></div>

    <div class="balloon clear right-balloon-3">
        <span>✦</span>
        <span>✧</span>
        <span>✦</span>
    </div>


    <!-- MAIN PAGE -->

    <main class="birthday-page">


        <!-- HEADING -->

        <section class="heading-section">

            <div class="small-happy">
                Happy
            </div>

            <h1>
                Birthday!
            </h1>

            <div class="cake-top">
                🎂
            </div>

            <div class="heart-line">
                <span>━</span>
                <b>♥</b>
                <span>━</span>
            </div>

        </section>


        <!-- PHOTO -->

        <section class="photo-section">

            <div class="photo-frame">

                <img
                    src="pic14.jpeg"
                    alt="Special Person">

            </div>

        </section>


        <!-- SPECIAL PERSON -->

        <section class="special-section">

            <div class="special-ribbon">

                <span>♥</span>

                <strong>
                    My Special Person
                </strong>

                <span>♥</span>

            </div>


            <p class="birthday-message">

                Wishing you lots of happiness, love,
                <br class="desktop-only">
                success and beautiful memories!

                <span>💗</span>

            </p>

        </section>


        <!-- BUTTONS -->

        <section class="button-section">


            <!-- WISHES -->

            <a
                href="wishes1.html"
                class="menu-button wishes-button">

                <div class="button-icon">
                    🎂
                </div>

                <div>
                    Wishes
                </div>

            </a>


            <!-- GALLERY -->

            <a
                href="gallery1.html"
                class="menu-button gallery-button">

                <div class="button-icon">
                    🖼️
                </div>

                <div>
                    Gallery
                </div>

            </a>


            <!-- SURPRISE -->

            <a
                href="surprise.html"
                class="menu-button surprise-button">

                <div class="button-icon">
                    🎁
                </div>

                <div>
                    Surprise
                </div>

            </a>


            <!-- MUSIC -->

            <a
                href="music.html"
                class="menu-button music-button">

                <div class="button-icon">
                    🎵
                </div>

                <div>
                    Music
                </div>

            </a>


        </section>


        <!-- BOTTOM -->

        <section class="bottom-section">

            <div class="bottom-line">

                <span>←</span>

                <b>♥</b>

                <span>→</span>

            </div>

            <p>
                Made with
                <span>♥</span>
                just for you!
            </p>

        </section>


    </main>


    <!-- GIFTS -->

    <div class="gift gift-left">

        <div class="gift-lid"></div>

        <div class="gift-box">

            <div class="gift-ribbon-vertical"></div>

            <div class="gift-ribbon-horizontal"></div>

        </div>

    </div>


    <div class="small-gift small-gift-left">

        <div class="small-lid"></div>

        <div class="small-box">

            <div class="small-ribbon"></div>

        </div>

    </div>


    <div class="gift gift-right">

        <div class="gift-lid"></div>

        <div class="gift-box">

            <div class="gift-ribbon-vertical"></div>

            <div class="gift-ribbon-horizontal"></div>

        </div>

    </div>


    <div class="small-gift small-gift-right">

        <div class="small-lid"></div>

        <div class="small-box">

            <div class="small-ribbon"></div>

        </div>

    </div>


    <script src="script1.js"></script>

</body>

</html>
