<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Birthday Music ❤️</title>

    <link rel="stylesheet" href="style1.css">

</head>

<body>

    <!-- BACKGROUND MUSIC -->

    <audio id="bgMusic" loop>
        <source src="birthday1.mp3" type="audio/mpeg">
    </audio>


    <div class="music-page">

        <div class="music-hearts">
            ❤️ 💕 💖 🎵 💖 💕 ❤️
        </div>


        <h1>
            Birthday Music 🎵
        </h1>


        <p class="music-subtitle">
            A special song just for you ❤️
        </p>


        <div class="music-card">

            <img
                src="pic17.jpeg"
                alt="Special Person"
                class="music-photo">


            <h2>
                🎶 Happy Birthday 🎶
            </h2>


          


            <!-- MUSIC PLAYER -->

            <audio
                id="birthdayMusic"
                controls>

                <source
                    src="birthday1.mp3"
                    type="audio/mpeg">

                Your browser does not support audio.

            </audio>


            <p class="music-note">
                🎧 Press Play and enjoy the music ❤️
            </p>

        </div>


        <a
            href="index1.html"
            class="menu-button music-button">

            ← Back to Birthday

        </a>

    </div>


    <script src="script1.js"></script>

</body>

</html>
